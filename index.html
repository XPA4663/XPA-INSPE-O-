<style>
:root{--navy:#0A1733;--band:#16264D;--navy2:#13244A;--gold:#F4B400;--goldt:#B58600;--line:#D5DAE2;--bg:#F3F4F6;--ink:#1B2333;--muted:#6B7385;
--ok:#2E7D32;--att:#B58600;--nc:#C62828;--na:#8A93A6}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
header .lg{height:44px;width:auto;display:block}
header .ttl{margin-left:auto;text-align:right;font-size:12px;color:#B8C2D6}
main{max-width:860px;margin:0 auto;padding:14px 12px 90px}
h2{font-size:17px;margin:4px 0 12px;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.sec{background:var(--band);color:#fff;font-weight:bold;padding:9px 12px;border-radius:8px;margin:16px 0 8px;font-size:14px}
label{display:block;font-size:12px;font-weight:bold;color:var(--navy);margin:8px 0 3px}
html{color-scheme:light}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:16px;background:#fff;color:#1B2333;-webkit-text-fill-color:#1B2333;caret-color:#0A1733;opacity:1;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#6B7385 50%),linear-gradient(135deg,#6B7385 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input::placeholder,textarea::placeholder{color:#8A93A6;-webkit-text-fill-color:#8A93A6}
input:focus,select:focus,textarea:focus{outline:2px solid #F4B400;border-color:#F4B400}
button{color:#1B2333;-webkit-text-fill-color:currentColor}
textarea{min-height:56px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:9px 13px;color:var(--ink)}
.btn{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:bold}
.btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--navy)}
.btn.danger{background:#fff;color:var(--nc);border-color:var(--nc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list .it{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer}
.list .it .t{font-weight:bold;color:var(--navy)}
.list .it .s{font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:bold;padding:3px 8px;border-radius:20px;color:#fff;white-space:nowrap}
.p-ok{background:var(--ok)}.p-n{background:#2E7D32}.p-p4{background:#1D6FB8}.p-p3{background:#B58600}.p-p2{background:#D35400}.p-p1{background:#C62828}.p-att{background:var(--att)}.p-nc{background:var(--nc)}.p-crit{background:#7B1010}.p-pend{background:var(--na)}
.grp{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;overflow:hidden}
.grp>summary{list-style:none;padding:12px;font-weight:bold;color:#fff;background:var(--navy2);display:flex;justify-content:space-between;cursor:pointer}
.grp>summary::-webkit-details-marker{display:none}
.item{padding:11px 12px;border-top:1px solid var(--line)}
.item .q{font-size:14px}
.item .ref{font-size:11px;color:var(--muted);margin-top:2px}
.item .crit{color:var(--nc);font-size:10px;font-weight:bold;letter-spacing:.5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.seg button{padding:8px 2px;font-size:12px;font-weight:bold}
.seg .on.s-C{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg .on.s-A{background:var(--att);color:#fff;border-color:var(--att)}
.seg .on.s-NC{background:var(--nc);color:#fff;border-color:var(--nc)}
.seg .on.s-NA{background:var(--na);color:#fff;border-color:var(--na)}
.extra{margin-top:8px;display:none}
.extra.show{display:block}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs .th{position:relative}
.thumbs img{width:74px;height:74px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thumbs .x{position:absolute;top:-6px;right:-6px;background:var(--nc);color:#fff;border:none;border-radius:50%;width:22px;height:22px;padding:0;font-size:13px;line-height:22px}
.lbtn{display:inline-block;font-weight:bold;cursor:pointer;border-radius:8px;border:1px solid var(--navy);padding:9px 13px;color:var(--navy);background:#fff;font-size:14px;margin:0}
.hid{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.sv{cursor:pointer;font-size:11px;padding:3px 8px;border-radius:12px;background:#16264D;color:#B8C2D6;margin-top:4px;display:inline-block}
.sv.err{background:#C62828;color:#fff}.sv.ok{background:#2E7D32;color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;justify-content:center;z-index:5}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.prog>div{height:100%;background:var(--gold)}
.note{font-size:12px;color:var(--muted)}
.banner{font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:10px;background:#FFF7E0;border:1px solid var(--gold)}
.result{display:flex;align-items:center;gap:10px;justify-content:space-between}
.modal{position:fixed;inset:0;background:rgba(10,23,51,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:12px;padding:18px;max-width:380px;width:100%}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;display:none;z-index:30;max-width:90%}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.tp{padding:10px 12px;font-size:14px;border-color:var(--line)}.tp .note{font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.chip{font-size:12px;padding:5px 10px;border-radius:16px;background:#fff;border:1px solid var(--line)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>

<script>
/* ======================= NÚCLEO – helpers ======================= */
const MODS={}; const MODS_ORD=[];
function registrar(mod){ MODS[mod.k]=mod; MODS_ORD.push(mod.k); }
const MOD=()=>CUR?MODS[CUR.mod]:null;
const num=(v)=>{ if(v===undefined||v===null||String(v).trim()==='') return null; let s=String(v).trim(); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const x=parseFloat(s); return isNaN(x)?null:x; };
const f1=(x,d=1)=>x===null||x===undefined||isNaN(x)?'-':(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtN=(x)=>x===null||x===undefined?'-':x.toLocaleString('pt-BR',{maximumFractionDigits:2});
const slug=(s)=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_').replace(/^_+|_+$/g,'');
const RESP_PADRAO='Eng. Magidiel Xavier Araújo – CREA 5069271199';
const EMPRESA={nome:'XPA Engenharia, Manutenção e Comércio Ltda.', site:'www.xpaengenharia.com.br', email:'comercial@xpaengenharia.com.br', fones:'(11) 2987-4200 · (11) 99609-4663 · (11) 91234-4920', end:'Rua Aragão, 538 · Vila Mazzei · São Paulo · SP', slogan:'Segurança, confiabilidade e excelência em soluções elétricas.'};

/* ======================= STATE ======================= */
let INSPS=[], CUR=null, ITEM=null, VIEW='home', FILTRO='';
const uid=(p)=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',3200); }
let saveT=null;
function saveCur(){ if(!CUR) return; CUR.updatedAt=Date.now(); clearTimeout(saveT); saveT=setTimeout(()=>writeDoc(CUR.id, JSON.parse(JSON.stringify(CUR))),700); }
function today(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }
function editable(x){ return (x && Object.isFrozen && (Object.isFrozen(x) || (x.items && Object.isFrozen(x.items)))) ? JSON.parse(JSON.stringify(x)) : x; }
function photoIdsJob(job){ const m=MODS[job.mod]; if(!m) return []; return (job.items||[]).flatMap(it=>m.photoIds(it)); }

/* ======================= VIEWS (núcleo) ======================= */
function setBar(html){ $('#bar').innerHTML=html; $('#bar').style.display=html?'flex':'none'; }
function go(v){ VIEW=v; render(); window.scrollTo(0,0); }
function render(){
  if(VIEW==='home') return vHome();
  if(!CUR||!MOD()){ VIEW='home'; return vHome(); }
  if(VIEW==='job'){ MOD().vJob(CUR); $('#app').insertAdjacentHTML('beforeend',datalists()); return; }
  if(VIEW==='item') return MOD().vItem(CUR,ITEM);
}
function storageBanner(){
  if(MODE==='db') return '';
  if(MODE==='local') return '<div class="banner">📱 Os trabalhos ficam salvos <b>neste aparelho</b> e o app funciona sem internet. Ao final de cada visita, toque em <b>Exportar backup</b> dentro do trabalho e guarde o arquivo (Drive, WhatsApp ou e-mail).</div>';
  return '<div class="banner">Armazenamento indisponível nesta visualização: os dados ficam só enquanto a página estiver aberta. Gere o PDF antes de sair.</div>';
}
function datalists(){
  const u=(k)=>[...new Set(INSPS.map(x=>(x.h||{})[k]).filter(Boolean))].sort();
  return `<datalist id="dl_cliente">${u('cliente').map(v=>`<option value="${esc(v)}">`).join('')}</datalist><datalist id="dl_local">${u('local').map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
}
function field(k,label,obj,type='text',ph='',extra=''){
  if(k==='cliente'&&!/list=/.test(extra)) extra+=' list="dl_cliente"'; if(k==='local'&&!/list=/.test(extra)) extra+=' list="dl_local"';
  return `<div><label>${label}</label>${type==='textarea'?`<textarea data-k="${k}" placeholder="${ph}">${esc(obj[k])}</textarea>`:`<input type="${type}" data-k="${k}" value="${esc(obj[k])}" placeholder="${ph}" ${extra}>`}</div>`;
}
function sel(k,label,obj,opts){ return `<div><label>${label}</label><select data-k="${k}">${opts.map(o=>{ const v=Array.isArray(o)?o[0]:o, t=Array.isArray(o)?o[1]:o; return `<option value="${esc(v)}" ${String(obj[k]??'')===String(v)?'selected':''}>${esc(t)}</option>`; }).join('')}</select></div>`; }
function bindFields(root,obj,after){
  root.querySelectorAll('[data-k]').forEach(el=>{ const fn=()=>{ obj[el.dataset.k]=el.value; saveCur(); after&&after(); }; el.oninput=fn; el.onchange=fn; });
}
const DEC='inputmode="decimal"';

function vHome(){
  let list = INSPS.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(FILTRO) list=list.filter(x=>x.mod===FILTRO);
  const chips=`<div class="chips"><button class="chip ${FILTRO?'':'on'}" data-f="">Todos (${INSPS.length})</button>${MODS_ORD.map(k=>{ const n=INSPS.filter(x=>x.mod===k).length; return n?`<button class="chip ${FILTRO===k?'on':''}" data-f="${k}">${MODS[k].icone} ${esc(MODS[k].curto)} (${n})</button>`:''; }).join('')}</div>`;
  $('#app').innerHTML = contaBarra() + storageBanner() + `<h2>Trabalhos</h2>${INSPS.length?chips:''}
  <div class="list">${list.length? list.map(x=>{ const m=MODS[x.mod]; if(!m) return ''; const r=m.resumo(x);
    return `<div class="it" data-id="${x.id}"><div style="font-size:22px">${m.icone}</div><div style="flex:1"><div class="t">${esc(x.h.cliente||'Sem cliente')}</div>
    <div class="s">${esc(m.curto)} · ${x.h.numero?esc(x.h.numero)+' · ':''}${fmtDate(x.h.data)}${r.txt?' · '+esc(r.txt):''}</div></div>${r.pill?`<span class="pill p-${r.pill.k}">${esc(r.pill.t)}</span>`:''}<span style="color:var(--muted)">›</span></div>`;}).join('')
  : `<div class="empty">Nenhum trabalho ainda.<br>Toque em <b>Novo trabalho</b> para começar.</div>`}</div>
  <div class="card note"><b>Módulos disponíveis:</b> ${MODS_ORD.map(k=>MODS[k].icone+' '+esc(MODS[k].nome)).join(' · ')}.<br>Cada trabalho gera relatório em PDF (padrão XPA) ou Excel. Os dados ficam no aparelho; exporte o backup ao fim de cada visita.</div>
  <div class="row"><button class="btn ghost" id="imp">Importar backup</button><input type="file" id="impf" accept=".json,application/json" style="display:none"></div>`;
  bindContaBarra();
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ FILTRO=c.dataset.f; vHome(); });
  document.querySelectorAll('.it').forEach(e=>e.onclick=()=>{ const k=INSPS.findIndex(x=>x.id===e.dataset.id); INSPS[k]=editable(INSPS[k]); CUR=INSPS[k]; go('job'); });
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=importBackup;
  setBar(`<button class="btn gold" id="nova">+ Novo trabalho</button>`);
  $('#nova').onclick=escolherModulo;
}
function escolherModulo(){
  $('#mbox').innerHTML=`<p style="margin-top:0;font-weight:bold;color:var(--navy)">Tipo de trabalho</p>
  <div style="display:grid;gap:6px;max-height:60vh;overflow:auto">${MODS_ORD.map(k=>`<button class="tp" data-t="${k}" style="text-align:left">${MODS[k].icone} <b>${esc(MODS[k].nome)}</b><br><span class="note">${esc(MODS[k].desc||'')}</span></button>`).join('')}</div>
  <div class="row" style="justify-content:flex-end;margin-top:8px"><button id="mn">Cancelar</button></div>`;
  $('#modal').classList.add('show');
  $('#mn').onclick=()=>$('#modal').classList.remove('show');
  document.querySelectorAll('.tp').forEach(b=>b.onclick=()=>{ $('#modal').classList.remove('show'); novoTrabalho(b.dataset.t); });
}
function novoTrabalho(mod){
  const m=MODS[mod]; const ult=INSPS.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
  const h=Object.assign({numero:'',cliente:'',local:'',data:today(),resp:RESP_PADRAO,obs:''}, m.novoH());
  if(ult&&ult.h){ h.cliente=ult.h.cliente||''; h.local=ult.h.local||''; } // sugere o último cliente
  const n={kind:'job', mod, id:uid(mod), createdAt:Date.now(), updatedAt:Date.now(), h, items:[], uid:UID||undefined};
  INSPS.push(n); CUR=n; writeDoc(n.id, JSON.parse(JSON.stringify(n))); go('job');
}
/* botões padrão do rodapé do trabalho e exclusão */
function jobFooter(){
  return `<div class="row" style="margin-top:14px"><button class="btn ghost" id="bk">Exportar backup</button><button class="btn danger" id="del">Excluir trabalho</button></div>`;
}
function bindJobFooter(){
  $('#del').onclick=()=>confirmBox('Excluir este trabalho e todas as imagens?', async()=>{
    for(const p of photoIdsJob(CUR)) await delDoc(p);
    await delDoc(CUR.id); INSPS=INSPS.filter(x=>x!==CUR); CUR=null; go('home');
  });
  $('#bk').onclick=exportBackup;
  $('#back').onclick=()=>go('home');
}

/* ======================= BACKUP ======================= */
async function exportBackup(){
  const photos={};
  for(const id of photoIdsJob(CUR)){ const p=await getPhoto(id); if(p) photos[id]=p; }
  const name=`Backup_${slug(MOD().curto)}_${slug(CUR.h.cliente||'cliente')}_${CUR.h.data||''}.json`;
  saveFile(name, JSON.stringify({app:'xpa-inspecoes', v:2, job:CUR, photos}));
}
const LEGACY={'xpa-insp-termo':{mod:'termo',arr:'motors'},'xpa-mp-se':{mod:'se',arr:'equips'}};
function converterLegado(o){
  const lg=LEGACY[o.app]; if(!lg) return null; const ins=o.insp; if(!ins) return null;
  const job={kind:'job', mod:lg.mod, id:ins.id, createdAt:ins.createdAt||Date.now(), updatedAt:Date.now(), h:ins.h||{}, items:ins[lg.arr]||[]};
  return job;
}
async function importBackup(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const o=JSON.parse(await f.text());
    let job=null; if(o.app==='xpa-inspecoes') job=o.job; else job=converterLegado(o);
    if(!job||!MODS[job.mod]) throw 0;
    for(const [id,p] of Object.entries(o.photos||{})){ photoCache[id]=p; await writeDoc(id,p); }
    job.kind='job'; job.updatedAt=Date.now(); if(UID) job.uid=UID; const ex=INSPS.findIndex(x=>x.id===job.id); if(ex>=0) INSPS[ex]=job; else INSPS.push(job);
    await writeDoc(job.id, job); toast('Backup importado'+(o.app!=='xpa-inspecoes'?' (convertido do app antigo).':'.')); render();
  }catch(err){ toast('Arquivo de backup inválido.'); }
}

/* ======================= RELATÓRIO – escolha do formato ======================= */
function escolherRelatorio(){
  $('#mbox').innerHTML=`<p style="margin-top:0;font-weight:bold;color:var(--navy)">Gerar relatório</p>
  <p class="note" style="margin-top:0">Escolha o formato:</p>
  <div style="display:grid;gap:8px">
    <button class="btn gold" id="opPdf">📄 PDF – relatório padrão XPA</button>
    <button class="btn" id="opXls">📊 Excel – planilha editável</button>
    <button id="opNo">Cancelar</button>
  </div>`;
  $('#modal').classList.add('show');
  $('#opNo').onclick=()=>$('#modal').classList.remove('show');
  $('#opPdf').onclick=()=>{ $('#modal').classList.remove('show'); MOD().pdf(CUR); };
  $('#opXls').onclick=()=>{ $('#modal').classList.remove('show'); MOD().excel(CUR); };
}

/* ======================= PDF – kit padrão XPA ======================= */
const C_NAVY=[10,23,51], C_BAND=[22,38,77], C_GOLD=[244,180,0], C_LINE=[213,218,226], C_BG=[243,244,246], C_MUT=[107,115,133];
function pdfKit(h){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210, H=297, M=14, INK=[27,35,51], LIGHT=[184,194,214]; const TOC=[]; let secN=0, SUMPAGE=0;
  const K={doc,W,H,M,INK,LIGHT,TOC};
  K.band=(t,y)=>{ doc.setFillColor(...C_BAND); doc.rect(M,y,W-2*M,8,'F'); doc.setFillColor(...C_GOLD); doc.rect(M,y,1.4,8,'F');
    doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.text(doc.splitTextToSize(t,W-2*M-8)[0],M+4,y+5.5); doc.setTextColor(...INK); return y+11; };
  K.sec=(t,y)=>{ const tt=`${++secN}. ${t}`; TOC.push({t:tt,p:doc.getNumberOfPages()}); return K.band(tt,y); };
  K.nextSec=()=>++secN;
  K.ensure=(y,need)=>{ if(y+need>276){ doc.addPage(); return 22; } return y; };
  K.para=(txt,y,o={})=>{ doc.setFont('helvetica',o.bold?'bold':(o.italic?'italic':'normal')); doc.setFontSize(o.size||9); doc.setTextColor(...(o.color||INK));
    const l=doc.splitTextToSize(txt,W-2*M-(o.indent||0)); for(const ln of l){ y=K.ensure(y,5); doc.text(ln,M+(o.indent||0),y+1); y+=(o.size||9)*0.45; } doc.setTextColor(...INK); return y+2; };
  K.bul=(txt,y)=>{ y=K.ensure(y,6); doc.setFillColor(...C_GOLD); doc.circle(M+1.5,y,0.8,'F'); return K.para(txt,y,{indent:4}); };
  K.tbl=(opts)=>{ doc.autoTable(Object.assign({margin:{left:M,right:M,top:22,bottom:24}, theme:'grid',
    styles:{fontSize:8.5,cellPadding:1.8,lineColor:C_LINE,lineWidth:.2,textColor:INK,valign:'middle'}, headStyles:{fillColor:[19,36,74],textColor:255}},opts)); return doc.lastAutoTable.finalY+5; };
  // desenha uma foto dentro de uma moldura x,y,cw,chh com legenda
  K.foto=async(id,x,y,cw,chh,cap,bold=true)=>{ doc.setDrawColor(...C_LINE); doc.rect(x,y,cw,chh); const P=id?await getPhoto(id):null;
    if(P){ const k=Math.min(cw/P.w,chh/P.h); try{ doc.addImage(P.data,'JPEG',x+(cw-P.w*k)/2,y+(chh-P.h*k)/2,P.w*k,P.h*k); }catch(e){} }
    else { doc.setFontSize(8); doc.setTextColor(...C_MUT); doc.text('Sem imagem',x+cw/2,y+chh/2,{align:'center'}); }
    doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(7.5); doc.setTextColor(...(bold?C_NAVY:C_MUT)); doc.text(doc.splitTextToSize(cap,cw)[0],x,y+chh+4); doc.setTextColor(...INK); return !!P; };
  // galeria em 2 colunas; retorna y
  K.galeria=async(lista,y,titulo)=>{ if(!lista.length) return y; y=K.ensure(y,80); y=K.band(titulo||'Registro fotográfico',y);
    const cw=(W-2*M-6)/2, chh=60; let col=0;
    for(const p of lista){ const P=await getPhoto(p.id); if(!P) continue; if(col===0) y=K.ensure(y,chh+10);
      await K.foto(p.id,M+col*(cw+6),y,cw,chh,p.cap,false); col++; if(col===2){ col=0; y+=chh+9; } }
    if(col===1) y+=chh+9; return y; };
  K.capa=(t1,t2,rows)=>{
    doc.setFillColor(...C_NAVY); doc.rect(0,0,W,H,'F');
    try{ doc.addImage(COVER_TOP,'JPEG',0,0,W,124.7); }catch(e){}
    try{ doc.addImage(LOGO_BRANCO,'PNG',M+2,132,72.8,28); }catch(e){}
    doc.setFillColor(...C_GOLD); doc.rect(M+2,166,22,1.6,'F');
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...LIGHT);
    doc.text(`RELATÓRIO TÉCNICO${h.numero?' · Nº '+h.numero:''}`,M+2,176,{charSpace:0.6});
    doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.setTextColor(255);
    doc.text(t1,M+2,188); doc.text(t2,M+2,198);
    let cy=210;
    for(const [k,v] of rows){
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...C_GOLD); doc.text(k,M+2,cy+4,{charSpace:0.5});
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(255); doc.text(doc.splitTextToSize(v||'-',120)[0],M+56,cy+4);
      doc.setDrawColor(42,58,94); doc.setLineWidth(0.2); doc.line(M+2,cy+7,W-M-10,cy+7); cy+=9;
    }

    putk(kr+1,EMPRESA.slogan,X.font({italic:true,size:10,color:{argb:'FFB8C2D6'}}));
    putk(kr+2,EMPRESA.nome,X.font({size:8,color:{argb:'FFB8C2D6'}}));
    return wk;
  };
  X.salvar=async(fname)=>{ wb.views=[{activeTab:0}]; const buf=await wb.xlsx.writeBuffer();
    const ok=await saveFile(fname, new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})); if(ok) toast('Planilha gerada.'); return ok; };

let DB=null, UID=null, MODE='mem'; const DIAG={runtime:'não', db:'-', user:'-', id:'-', downloads:'-', local:'-', idb:'-'};

function status(t,k){ const e=document.getElementById('sv'); if(!e) return; e.textContent=t; e.className='sv'+(k?' '+k:''); }
const online=()=>navigator.onLine!==false;
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);

function idbOpen(){ return new Promise(res=>{ try{ const rq=indexedDB.open('xpa_inspecoes',1);
  rq.onupgradeneeded=()=>{ const d=rq.result; if(!d.objectStoreNames.contains('docs')) d.createObjectStore('docs'); if(!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox'); };
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); rq.onblocked=()=>res(null); setTimeout(()=>res(null),4000); }catch(e){ res(null); } }); }
function idbReq(store,mode,fn){ return new Promise((res,rej)=>{ try{ const tx=IDB.transaction(store,mode); const r=fn(tx.objectStore(store));
  tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }catch(e){ rej(e); } }); }
const idb={
  get:(s,k)=>IDB?idbReq(s,'readonly',st=>st.get(k)).catch(()=>undefined):Promise.resolve(undefined),
  put:(s,k,v)=>IDB?idbReq(s,'readwrite',st=>st.put(v,k)).then(()=>true).catch(()=>false):Promise.resolve(false),
  del:(s,k)=>IDB?idbReq(s,'readwrite',st=>st.delete(k)).catch(()=>{}):Promise.resolve(),
  all:(s)=>IDB?new Promise(res=>{ try{ const out=[]; const tx=IDB.transaction(s,'readonly'); const rq=tx.objectStore(s).openCursor();
    rq.onsuccess=()=>{ const c=rq.result; if(c){ out.push([c.key,c.value]); c.continue(); } }; tx.oncomplete=()=>res(out); tx.onerror=()=>res(out); }catch(e){ res([]); } }):Promise.resolve([]),
};
function legacyLoad(){ try{ const s=localStorage.getItem(LSK); if(s){ const o=JSON.parse(s); mem.insp=o.insp||{}; mem.photo=o.photo||{}; } return true; }catch(e){ return false; } }
function legacySave(){ try{ localStorage.setItem(LSK, JSON.stringify({insp:mem.insp, photo:IDB?{}:mem.photo})); return true; }catch(e){ return false; } }
async function localPut(id,body){ const ok=await idb.put('docs',id,body); if(body.kind==='photo'){ if(!ok) mem.photo[id]=body; } else { mem.insp[id]=body; } if(!ok||body.kind!=='photo') legacySave(); return ok; }
async function localGet(id){ return (await idb.get('docs',id)) || mem.insp[id] || mem.photo[id] || null; }
async function localDel(id){ await idb.del('docs',id); delete mem.insp[id]; delete mem.photo[id]; legacySave(); }
async function localList(){ const a=(await idb.all('docs')).map(x=>x[1]).filter(d=>d&&d.kind==='job'); const ids=new Set(a.map(x=>x.id)); Object.values(mem.insp).forEach(x=>{ if(!ids.has(x.id)) a.push(x); }); return a; }

function showStatus(){
  const net=document.getElementById('net');
  if(net) net.style.display = (!online()) ? 'block' : 'none';
  if(MODE!=='db'){ status(IDB||DIAG.local==='ok'?'Salvo neste aparelho':'Sem armazenamento', IDB||DIAG.local==='ok'?'ok':'err'); return; }
  if(!online()) status(PENDING?`Sem internet · ${PENDING} pendente(s)`:'Sem internet · tudo salvo', PENDING?'err':'');
  else if(SYNCING) status('Sincronizando...');
  else if(PENDING) status(`${PENDING} pendente(s) de envio`,'err');
  else status('Salvo na conta','ok');
}
async function refreshPending(){ PENDING=(await idb.all('outbox')).length; showStatus(); }
function scheduleSync(){ clearTimeout(syncT); syncT=setTimeout(sync,1200); }
async function pushOne(id,op){
  if(op==='del') return withTimeout(col().doc(id).delete(),15000);
  const b=await localGet(id); if(!b) return;
  return withTimeout(col().doc(id).set(b),25000);
}
async function sync(){
  if(MODE!=='db'||SYNCING||!online()||!IDB){ showStatus(); return; }
  SYNCING=true; showStatus();
  try{
    const items=await idb.all('outbox');
    items.sort((a,b)=>(a[1].kind==='photo'?0:1)-(b[1].kind==='photo'?0:1));
    for(const [id,o] of items){
      try{ await pushOne(id,o.op); const cur=await idb.get('outbox',id); if(cur&&cur.at===o.at) await idb.del('outbox',id); }
      catch(e){ const code=e&&e.code;
        if(code==='quota_exceeded'){ toast('Espaço da conta cheio. Exclua inspeções antigas.'); break; }
        if(code==='invalid_argument'){ await idb.del('outbox',id); continue; }
        break; }
    }
  } finally { SYNCING=false; await refreshPending(); }
}
/* gravação direta (somente quando o aparelho não tem IndexedDB) */
const queues={};
function directWrite(id, body){
  const q = queues[id] || (queues[id]={running:false,pending:null}); q.pending = body;
  if(q.running) return Promise.resolve();
  return (async()=>{ q.running=true;
    while(q.pending){ const b=q.pending; q.pending=null;
      try{ await withTimeout(col().doc(id).set(b),25000); status('Salvo na conta','ok'); }
      catch(e){ status('Não salvo: '+((e&&e.code)||'erro'),'err'); } }
    q.running=false; })();
}
async function writeDoc(id, body){
  await localPut(id, body);
  if(MODE!=='db'){ showStatus(); return; }
  if(!IDB) return directWrite(id, body);
  await idb.put('outbox', id, {op:'set', kind:body.kind, at:Date.now()+Math.random()});
  await refreshPending(); scheduleSync();
}
async function delDoc(id){
  await localDel(id); delete photoCache[id];
  if(MODE!=='db') return;
  if(!IDB){ try{ await col().doc(id).delete(); }catch(e){} return; }
  await idb.put('outbox', id, {op:'del', at:Date.now()+Math.random()}); await refreshPending(); scheduleSync();
}

async function decodeImage(file){
  const log=[]; const tryStep=async(name,fn)=>{ try{ const r=await fn(); if(r&&r.width>0){ log.push(name+': ok'); return r; } log.push(name+': vazio'); }catch(e){ log.push(name+': '+((e&&(e.name||'')+' '+(e.message||''))||e).trim()); } return null; };
  let r=null;
  if(window.createImageBitmap){
    r = await tryStep('bitmap reduzido', ()=>createImageBitmap(file,{resizeWidth:1200,resizeQuality:'medium',imageOrientation:'from-image'}));
    if(!r) r = await tryStep('bitmap', ()=>createImageBitmap(file));
  }
  if(!r) r = await tryStep('blob url', async()=>{ const u=URL.createObjectURL(file); try{ return await loadImg(u); } finally{ setTimeout(()=>URL.revokeObjectURL(u),30000); } });
  if(!r && window.createImageBitmap) r = await tryStep('buffer', async()=>{ const buf=await file.arrayBuffer(); return createImageBitmap(new Blob([buf],{type:'image/jpeg'})); });
  if(!r) r = await tryStep('data url', async()=>loadImg(await readAsDataURL(file)));
  PHOTO_LOG.push({nome:file.name||'-', tipo:file.type||'(vazio)', tamanho:file.size, passos:log});
  if(!r){ const e=new Error('decode'); e.log=log; throw e; }
  return r;
}
async function compress(file){
  const isHeic=/hei[cf]/i.test(file.type||'')||/\.hei[cf]$/i.test(file.name||'');
  if(!file.size){ const e=new Error('arquivo vazio'); e.log=['O celular entregou a foto com 0 bytes']; throw e; }
  let src;
  try{ src=await decodeImage(file); }
  catch(e){
    if(isHeic) e.message='heic';
    throw e;
  }
  const sw=src.width, sh=src.height;
  let max=1100, q=0.6, out, w, h;
  for(let k=0;k<6;k++){
    const s=Math.min(1,max/Math.max(sw,sh)); w=Math.max(1,Math.round(sw*s)); h=Math.max(1,Math.round(sh*s));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(src,0,0,w,h);
    try{ out=c.toDataURL('image/jpeg',q); }catch(err){ const e=new Error('canvas'); e.log=['toDataURL: '+(err&&err.name)]; throw e; }
    if(out.length<200000) break; max*=0.8; q=Math.max(0.35,q-0.07);
  }
  if(src.close) try{ src.close(); }catch(e){}
  if(!out || out.length<100){ const e=new Error('canvas'); e.log=['imagem vazia após redução']; throw e; }
  return {data:out,w,h};
}
function photoError(file,e){
  const msg=String(e&&e.message||e);
  if(msg==='heic'){ toast('Foto em formato HEIC. No iPhone: Ajustes > Câmera > Formatos > Mais compatível.'); return; }
  const det=`Arquivo: ${file.name||'-'}\nTipo: ${file.type||'(vazio)'}\nTamanho: ${Math.round((file.size||0)/1024)} KB\nErro: ${msg}\n`+((e&&e.log)||[]).map(x=>'• '+x).join('\n')+`\nNavegador: ${navigator.userAgent}`;
  $('#mbox').innerHTML=`<p style="margin-top:0;font-weight:bold;color:var(--navy)">Não foi possível processar a foto</p>
  <pre style="white-space:pre-wrap;font-size:11.5px;background:var(--bg);padding:10px;border-radius:8px;max-height:45vh;overflow:auto">${esc(det)}</pre>
  <p class="note">Tire um print desta tela e envie para o suporte.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="mok">Fechar</button></div>`;
  $('#modal').classList.add('show'); $('#mok').onclick=()=>$('#modal').classList.remove('show');
}
function confirmBox(msg, yes){
  $('#mbox').innerHTML=`<p style="margin-top:0">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button id="mn">Cancelar</button><button class="btn danger" id="my">Confirmar</button></div>`;
  $('#modal').classList.add('show');
  $('#mn').onclick=()=>$('#modal').classList.remove('show');
  $('#my').onclick=async()=>{ $('#modal').classList.remove('show'); await yes(); };
}

async function saveFile(filename, data){
  if(window.claude){
    const dl = await window.claude.use('downloads').catch(()=>null);
    if(dl){ try{ await dl.save({filename, data}); return true; } catch(e){ if(e&&e.code!=='declined') toast('Não foi possível salvar o arquivo ('+(e.code||'erro')+').'); return false; } }
  }
  const type = filename.endsWith('.pdf')?'application/pdf':filename.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/json';
  const blob = data instanceof Blob ? data : new Blob([data],{type});
  const url = URL.createObjectURL(blob);
  let file=null; try{ file=new File([blob],filename,{type:blob.type||type}); }catch(e){}
  const canShare = !!(file && navigator.canShare && navigator.share && (()=>{ try{ return navigator.canShare({files:[file]}); }catch(e){ return false; } })());
  $('#mbox').innerHTML=`<p style="margin-top:0;font-weight:bold;color:var(--navy)">Arquivo pronto</p>
  <p class="note" style="margin-top:0;word-break:break-all">${esc(filename)}</p>
  <div style="display:grid;gap:8px">
    ${canShare?'<button class="btn gold" id="fShare">📤 Compartilhar (WhatsApp, Drive, e-mail…)</button>':''}
    <a class="btn ${canShare?'':'gold'}" id="fDl" href="${url}" download="${esc(filename)}" style="text-align:center;text-decoration:none;padding:9px 13px;border-radius:8px">⬇️ Baixar para o aparelho</a>
    <button id="fNo">Fechar</button>
  </div>`;
  $('#modal').classList.add('show');
  const close=()=>{ $('#modal').classList.remove('show'); setTimeout(()=>URL.revokeObjectURL(url),60000); };
  $('#fNo').onclick=close;
  $('#fDl').onclick=()=>setTimeout(close,300);
  if(canShare) $('#fShare').onclick=async()=>{ try{ await navigator.share({files:[file],title:filename}); close(); }catch(e){ if(e&&e.name!=='AbortError') toast('Não foi possível compartilhar. Use "Baixar".'); } };
  return true;
}

}

const FBCFG=(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&!/COLE_AQUI/.test(window.FIREBASE_CONFIG.apiKey))?window.FIREBASE_CONFIG:null;
let AUTH=null, FBUSER=null;
const SEMCONTA='xpa_sem_conta';
function erroAuth(e){ const c=(e&&e.code)||''; return c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')?'E-mail ou senha incorretos.':c.includes('invalid-email')?'E-mail inválido.':c.includes('too-many-requests')?'Muitas tentativas. Aguarde alguns minutos.':c.includes('network')?'Sem conexão com a internet.':c.includes('user-disabled')?'Usuário desativado. Fale com o administrador.':'Não foi possível entrar ('+(c||(e&&e.message)||'erro')+').'; }
function telaLogin(msg){
  setBar('');
  $('#app').innerHTML=`<div class="card" style="max-width:420px;margin:18px auto">
    <div style="font-weight:bold;color:var(--navy);font-size:18px;margin-bottom:4px">Entrar na conta XPA</div>
    <div class="note" style="margin-bottom:10px">Os trabalhos ficam sincronizados na nuvem e disponíveis em qualquer aparelho. Sem internet, o app continua funcionando com o que já estiver salvo.</div>
    ${msg?`<div class="banner" style="margin-bottom:10px">${esc(msg)}</div>`:''}
    <label>E-mail</label><input type="email" id="lg_email" autocomplete="username" inputmode="email" value="${esc(localStorage.getItem('xpa_last_email')||'')}">
    <label>Senha</label><input type="password" id="lg_senha" autocomplete="current-password">
    <div id="lg_err" class="note" style="color:#C62828;min-height:16px;margin-top:4px"></div>
    <button class="btn gold" id="lg_ok" style="width:100%;margin-top:6px">Entrar</button>
    <div class="row" style="justify-content:space-between;margin-top:10px"><button id="lg_esq">Esqueci a senha</button><button id="lg_sem">Usar sem conta</button></div>
    <div class="note" style="margin-top:10px">Sem conta: os dados ficam apenas neste aparelho. Para criar usuários, o administrador usa o console do Firebase.</div>
  </div>`;
  const go_=async()=>{ const em=$('#lg_email').value.trim(), sn=$('#lg_senha').value; if(!em||!sn){ $('#lg_err').textContent='Informe e-mail e senha.'; return; }
    $('#lg_ok').disabled=true; $('#lg_err').textContent='';
    try{ await AUTH.signInWithEmailAndPassword(em,sn); localStorage.setItem('xpa_last_email',em); sessionStorage.removeItem(SEMCONTA); }
    catch(e){ $('#lg_err').textContent=erroAuth(e); $('#lg_ok').disabled=false; } };
  $('#lg_ok').onclick=go_; $('#lg_senha').onkeydown=(e)=>{ if(e.key==='Enter') go_(); };
  $('#lg_esq').onclick=async()=>{ const em=$('#lg_email').value.trim(); if(!em){ $('#lg_err').textContent='Digite o e-mail para receber o link de redefinição.'; return; }
    try{ await AUTH.sendPasswordResetEmail(em); toast('E-mail de redefinição enviado para '+em); }catch(e){ $('#lg_err').textContent=erroAuth(e); } };
  $('#lg_sem').onclick=()=>{ sessionStorage.setItem(SEMCONTA,'1'); iniciar(); };
}
function contaBarra(){
  if(!FBCFG) return '';
  if(FBUSER) return `<div class="note" style="display:flex;justify-content:space-between;align-items:center;margin:0 0 8px">👤 ${esc(FBUSER.email||'')}<button id="lg_sair" style="font-size:12px;padding:4px 10px">Sair</button></div>`;
  return `<div class="note" style="display:flex;justify-content:space-between;align-items:center;margin:0 0 8px">Usando sem conta (dados só neste aparelho)<button id="lg_entrar" style="font-size:12px;padding:4px 10px">Entrar</button></div>`;
}
function bindContaBarra(){
  const s=$('#lg_sair'); if(s) s.onclick=()=>confirmBox('Sair da conta? Os trabalhos já sincronizados continuam na nuvem; os pendentes de envio ficam neste aparelho até o próximo login.', async()=>{ try{ await AUTH.signOut(); }catch(e){} sessionStorage.removeItem(SEMCONTA); location.reload(); });
  const e=$('#lg_entrar'); if(e) e.onclick=()=>{ sessionStorage.removeItem(SEMCONTA); location.reload(); };
}

</script>

<script>
/* ======================= DIAGNÓSTICO ======================= */
document.addEventListener('click',e=>{ if(e.target&&e.target.id==='sv'){
  const t=`Login: ${FBCFG?(FBUSER?FBUSER.email:'sem conta'):'não configurado'}\nAmbiente: ${DIAG.runtime}\nBanco de dados: ${DIAG.db}\nUsuário: ${DIAG.user} (${DIAG.id})\nDownload de arquivos: ${DIAG.downloads}\nArmazenamento do aparelho: ${DIAG.local} · banco local: ${DIAG.idb}\nPendentes de envio: ${PENDING}\nModo atual: ${MODE==='db'?'conta':MODE==='local'?'aparelho':'memória'}${DIAG.erro?'\nErro: '+DIAG.erro:''}`;
  $('#mbox').innerHTML=`<p style="margin-top:0;font-weight:bold;color:var(--navy)">Diagnóstico de salvamento</p><pre style="white-space:pre-wrap;font-size:13px;background:var(--bg);padding:10px;border-radius:8px">${esc(t)}</pre><p class="note">Envie um print desta tela para o suporte.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="mok">Fechar</button></div>`;
  $('#modal').classList.add('show'); $('#mok').onclick=()=>$('#modal').classList.remove('show');
}});
/* ======================= PWA (offline) ======================= */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller) toast('Nova versão do app baixada. Feche e abra o app para atualizar.'); }); });
    }).catch(()=>{});
  });
}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
/* ======================= INIT ======================= */
$('#app').innerHTML='<div class="empty">Carregando trabalhos...</div>'; setBar('');
let BOOT=false;
async function iniciar(){
  let user=null, dl=null;
  if(!BOOT){ BOOT=true; IDB=await idbOpen(); DIAG.idb=IDB?'ok':'indisponível'; DIAG.local=legacyLoad()?'ok':'bloqueado'; }
  DB=null; UID=null; MODE='mem';
  if(FBCFG && window.firebase){
    DIAG.runtime='firebase';
    try{
      if(!firebase.apps.length) firebase.initializeApp(FBCFG);
      AUTH=firebase.auth();
      if(!FBUSER) FBUSER=await new Promise(res=>{ const un=AUTH.onAuthStateChanged(u=>{ un(); res(u); },()=>res(null)); setTimeout(()=>res(AUTH.currentUser),6000); });
      if(!window._xpaAuthL){ window._xpaAuthL=1; AUTH.onAuthStateChanged(u=>{ if(u&&!FBUSER){ FBUSER=u; iniciar(); } }); }
      if(!FBUSER && !sessionStorage.getItem(SEMCONTA)){ telaLogin(online()?'':'Sem internet: para entrar é preciso conexão. Você pode usar sem conta por enquanto.'); return; }
      if(FBUSER){ DB=firebase.firestore(); UID=FBUSER.uid; }
    }catch(e){ DIAG.erro=String(e&&e.message||e); }
  } else if(FBCFG && !window.firebase){ DIAG.erro='Biblioteca do Firebase não carregou (sem internet no primeiro acesso?)'; toast('Login indisponível sem internet no primeiro acesso. Usando o aparelho.'); }
  else {
    DIAG.runtime = window.claude ? 'sim' : 'não';
    try{ if(window.claude) [DB,user,dl]=await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]); }catch(e){ DIAG.erro=String(e&&e.message||e); }
    try{ UID = user ? await user.id() : null; }catch(e){ UID=null; }
  }
  DIAG.db=DB?'ok':'indisponível'; DIAG.user=(FBUSER||user)?'ok':'indisponível'; DIAG.id=UID?'ok':'sem id'; DIAG.downloads=dl?'ok':'indisponível';
  let local=await localList();
  if(UID){ for(const x of local){ if(!x.uid){ x.uid=UID; await localPut(x.id,x); } } local=local.filter(x=>x.uid===UID); }
  else if(FBCFG){ local=local.filter(x=>!x.uid); }
  if(DB && UID){
    MODE='db';
    let remote=null;
    if(online()){ try{ const snap=await withTimeout(col().where('kind','==','job').get(),10000); remote=snap.docs.map(d=>JSON.parse(JSON.stringify(d.data()))); }catch(e){} }
    const ob=new Map(await idb.all('outbox'));
    const map={};
    (remote||[]).forEach(x=>{ if(!(ob.get(x.id)&&ob.get(x.id).op==='del')) map[x.id]=x; });
    for(const x of local){ const r=map[x.id];
      if(!r || (x.updatedAt||0)>(r.updatedAt||0)){ map[x.id]=x; if(remote && IDB && !ob.has(x.id)) await idb.put('outbox',x.id,{op:'set',kind:'job',at:Date.now()+Math.random()}); } }
    for(const r of (remote||[])){ const l=local.find(x=>x.id===r.id); if(!l || (r.updatedAt||0)>(l.updatedAt||0)) await localPut(r.id,r); }
    INSPS=Object.values(map);
    if(!remote) toast(online()?'A conta não respondeu: usando os dados salvos no aparelho.':'Sem internet: usando os dados salvos no aparelho.');
  } else { MODE = (IDB||DIAG.local==='ok') ? 'local' : 'mem'; INSPS=local; }
  if(!window._xpaL){ window._xpaL=1; window.addEventListener('online',()=>{ showStatus(); sync(); }); window.addEventListener('offline',showStatus); setInterval(()=>{ if(PENDING) sync(); },30000); }
  await refreshPending(); go('home'); sync();
  setTimeout(()=>{ prefetchPhotos(); ensureExcelJS(); },3000);
}
iniciar();
</script>
