<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>XPA Inspeções · Manutenção Preventiva de Relés de Proteção</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--navy:#0A1733;--band:#16264D;--navy2:#13244A;--gold:#F4B400;--line:#D5DAE2;--bg:#F3F4F6;--ink:#1B2333;--muted:#6B7385;
--ok:#1E7B3A;--okbg:#E3F2E7;--warn:#9A5B00;--warnbg:#FFF1D6;--bad:#B3261E;--badbg:#FBE3E1;--na:#8A93A6}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
header{background:var(--navy);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
header img{height:40px;width:auto;display:block}
header .ttl{margin-left:auto;text-align:right;font-size:12px;color:#B8C2D6}
main{max-width:960px;margin:0 auto;padding:14px 12px 96px}
h2{font-size:17px;margin:4px 0 12px;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.sec{background:var(--band);color:#fff;font-weight:bold;padding:9px 12px;border-radius:8px;margin:16px 0 8px;font-size:14px;border-left:6px solid var(--gold);display:flex;justify-content:space-between;align-items:center;gap:8px}
label{display:block;font-size:12px;font-weight:bold;color:var(--navy);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:16px;background:#fff;color:#1B2333;-webkit-text-fill-color:#1B2333;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#6B7385 50%),linear-gradient(135deg,#6B7385 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input::placeholder,textarea::placeholder{color:#8A93A6;-webkit-text-fill-color:#8A93A6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
textarea{min-height:56px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 10px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:9px 13px;color:var(--ink)}
.btn{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:bold}
.btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--navy)}
.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list .it{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer}
.list .it .t{font-weight:bold;color:var(--navy)}
.list .it .s{font-size:12px;color:var(--muted);margin-top:2px}
.pill{font-size:11px;font-weight:bold;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}.pend,.na{background:#EEF0F4;color:#6B7385}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
.chip b{font-size:16px;color:var(--navy)}
.chip span{font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:2px}
.chip.on{background:var(--navy);border-color:var(--navy)}
.chip.on b{color:var(--gold)}.chip.on span{color:#D9DEE8}
.tw{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--navy2);color:#fff;font-weight:bold;padding:7px 6px;text-align:center;white-space:nowrap;font-size:12px}
td{border-top:1px solid var(--line);padding:4px 5px;text-align:center;white-space:nowrap}
td input,td select{margin:0;padding:6px;text-align:center;min-width:70px;font-size:14px;background:#FFFBEA}
td.c{background:#F0F2F5;font-variant-numeric:tabular-nums}
td .x{border:0;background:transparent;color:var(--bad);padding:4px 6px;font-size:15px}
.tt{font-weight:bold;color:var(--navy);font-size:13px;margin:14px 0 2px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.chk .item{padding:10px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;justify-content:space-between}
.chk .item:first-child{border-top:0}
.seg{display:flex;gap:4px;flex:none}
.seg button{padding:7px 9px;font-size:12px;font-weight:bold;min-width:42px}
.seg .on.s-C{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg .on.s-NC{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg .on.s-NA{background:var(--na);color:#fff;border-color:var(--na)}
.drop{border:2px dashed var(--line);border-radius:8px;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;color:#7A8499;cursor:pointer;background:var(--bg);padding:8px}
.drop img{max-width:100%;max-height:420px;display:block}
.chart svg{width:100%;height:auto;display:block;margin-top:10px;background:#fff}
.note{font-size:12px;color:var(--muted)}
.banner{font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:10px;background:#FFF7E0;border:1px solid var(--gold)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;justify-content:center;z-index:5}
.modal{position:fixed;inset:0;background:rgba(10,23,51,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:12px;padding:18px;max-width:380px;width:100%}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;display:none;z-index:30;max-width:90%}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.sv{cursor:pointer;font-size:11px;padding:3px 8px;border-radius:12px;background:#16264D;color:#B8C2D6;margin-top:4px;display:inline-block}
.sv.err{background:#B3261E;color:#fff}.sv.ok{background:#1E7B3A;color:#fff}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi div{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:20px;color:var(--ink)}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
</style>
</head>

  (f.rows.z||[]).forEach(r=>{ const e=evZ(fn,s,r,T); const zm=num(r.zm), a=num(r.ang); if(zm===null||a===null) return; const ar=a*Math.PI/180;

function idbOpen(){ return new Promise(res=>{ try{ const rq=indexedDB.open('xpa_mp_reles',1);
  rq.onupgradeneeded=()=>{ const d=rq.result; ['docs','outbox'].forEach(n=>{ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); rq.onblocked=()=>res(null); setTimeout(()=>res(null),4000); }catch(e){ res(null); } }); }
function idbReq(st,mode,fn){ return new Promise((res,rej)=>{ try{ const tx=IDB.transaction(st,mode); const r=fn(tx.objectStore(st)); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }catch(e){ rej(e); } }); }
const idb={

   rq.onsuccess=()=>{ const c=rq.result; if(c){ out.push([c.key,c.value]); c.continue(); } }; tx.oncomplete=()=>res(out); tx.onerror=()=>res(out); }catch(e){ res([]); } }):Promise.resolve([])};

function showStatus(){ if(MODE!=='db'){ status(MODE==='local'?'Salvo neste aparelho':'Sem armazenamento',MODE==='local'?'ok':'err'); return; }

async function refreshPending(){ PENDING=(await idb.all('outbox')).length; showStatus(); }
function scheduleSync(){ clearTimeout(syncT); syncT=setTimeout(sync,1200); }
async function sync(){ if(MODE!=='db'||SYNCING||!online()||!IDB){ showStatus(); return; } SYNCING=true; showStatus();
  try{ const items=await idb.all('outbox'); items.sort((a,b)=>(a[1].kind==='photo'?0:1)-(b[1].kind==='photo'?0:1));
    for(const [id,o] of items){ try{ if(o.op==='del') await withTimeout(col().doc(id).delete(),15000); else { const b=await localGet(id); if(b) await withTimeout(col().doc(id).set(b),25000); }
        const cur=await idb.get('outbox',id); if(cur&&cur.at===o.at) await idb.del('outbox',id); }
      catch(e){ const c=e&&e.code; if(c==='quota_exceeded'){ toast('Espaço da conta cheio. Exclua manutenções antigas.'); break; } if(c==='invalid_argument'){ await idb.del('outbox',id); continue; } break; } }

function compress(file,max){ return new Promise(res=>{ const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
  res({data:c.toDataURL('image/jpeg',0.8),w:c.width,h:c.height}); }; im.onerror=()=>res(null); im.src=rd.result; }; rd.onerror=()=>res(null); rd.readAsDataURL(file); }); }

function calc(fn,kind,r,s,T){ // retorna [{html}] para as colunas calculadas, por nome
  if(kind==='pk'){ const e=evPk(fn,s,r,T); return {aj:e.aj>0?fx(e.aj,3)+' '+(F[fn].els[r.el]||{}).u:'—',err:fx(e.err,2),rr:fx(e.rr,3),st:pill(e.st,e.lab||LAB[e.st])}; }
  if(kind==='tm'){ const e=evTm(fn,s,r,T); return {M:fx(e.M,2),tt:isFinite(e.tt)?fx(e.tt):'∞',ems:e.err!==undefined?fx(e.err*1000,0):'—',pct:fx(e.pct,2),st:pill(e.st,e.lab||LAB[e.st])}; }
  if(kind==='ang'){ const e=evAng(fn,s,r,T); return {exp:fx(e.exp,1),dev:fx(e.dev,1),st:pill(e.st,LAB[e.st])}; }
  if(kind==='dif'){ const e=evDif(fn,s,r,T); return {it:fx(e.it,3),err:fx(e.err,2),st:pill(e.st,LAB[e.st])}; }
  if(kind==='z'){ const e=evZ(fn,s,r,T); return {zt:fx(e.zt,3),err:fx(e.err,2),tt:fx(e.tt,3),st:pill(e.st,e.lab||LAB[e.st])}; }
  if(kind==='chk'){ const e=evChk(r); return {st:pill(e.st,e.lab)}; } }

  if(kind==='tm') return `<td><select data-f="el">${Object.keys(F[fn].els).filter(k=>!F[fn].els[k].nt||k===r.el).map(k=>`<option ${k===r.el?'selected':''}>${esc(k)}</option>`).join('')}</select></td><td><input data-f="ph" value="${esc(r.ph)}" style="min-width:52px"></td><td>${inp('x',r.x)}</td>${cc('M')}${cc('tt')}<td>${inp('tm',r.tm)}</td>${cc('ems')}${cc('pct')}<td data-cc="st"></td>${X}`;

  for(let i=0;i<CUR.reles.length;i++){ const r=CUR.reles[i], d=r.d, res=results[i], T=tolOf(r);
    doc.addPage(); y=top(); band(`${sec}.${i+1} · Relé ${i+1} · ${d.tag||'Sem TAG'}`);
    kv([['TAG / circuito',d.tag],['Painel / cubículo',d.painel],['Fabricante',d.fab],['Modelo',d.modelo],['Nº de série',d.serie],['Firmware',d.fw],['Tensão auxiliar',d.vaux&&d.vaux+' Vcc'],['Frequência',d.freq+' Hz'],
       ['RTC fase',d.rtc],['RTC neutro',d.rtcn],['RTP',d.rtp],['Estudo de seletividade',d.estudo]]);
    if(r.img){ const p=await getPhoto(r.img); if(p){ sub('Desenho do equipamento sob teste'); await addImg(p,W-2*M,105,r.imgCap||''); } }
    sub('Inspeção e verificações gerais');
    table(['Item','Verificação','Resultado'],CHK.map((q,k)=>[k+1,q,{C:'Conforme',NC:'Não conforme',NA:'N/A'}[r.chk[k]]||'Pendente']),{columnStyles:{0:{cellWidth:10},1:{halign:'left'},2:{cellWidth:32}}});
    sub(`Tolerâncias: tempo ${T.tp} % ou ${T.tms} ms · pickup ${T.pk} % · ângulo ${T.ang}° · impedância ${T.z} %`); y+=1;
    for(const fn of res.fns){ const f=r.funcs[fn], D=F[fn], s=setVals(fn,f.set);
      band(`ANSI ${fn} · ${D.nome}`);
      const sp=D.set.map(([k,l,t])=>[l,t==='curve'?(CURVES[f.set[k]]||{}).n:String(f.set[k]??'')]); kv(sp);
      const rows=f.rows, out=(k,head,mapper)=>{ if(rows[k]&&rows[k].length){ sub(TBL[k].t); table(head,rows[k].map(mapper)); } };
      out('pk',['Elemento','Fase','Ajuste','Medido','Erro %','Rearme','Rearme/Pickup','Status'],x=>{ const e=evPk(fn,s,x,T); return [x.el,x.ph,e.aj>0?fx(e.aj,3)+' '+(D.els[x.el]||{}).u:'—',x.med||'—',fx(e.err,2),x.dr||'—',fx(e.rr,3),e.lab||LAB[e.st]]; });
      out('tm',['Elemento','Fase','Aplicado','Múltiplo','t teórico (s)','t medido (s)','Erro (ms)','Erro %','Status'],x=>{ const e=evTm(fn,s,x,T); return [x.el,x.ph,(x.x||'—')+' '+((D.els[x.el]||{}).u||''),fx(e.M,2),isFinite(e.tt)?fx(e.tt):'∞',x.tm||'—',e.err!==undefined?fx(e.err*1000,0):'—',fx(e.pct,2),e.lab||LAB[e.st]]; });
      out('ang',['Limite','Fase','Esperado (°)','Medido (°)','Desvio (°)','Status'],x=>{ const e=evAng(fn,s,x,T); return [x.lab,x.ph,fx(e.exp,1),x.med||'—',fx(e.dev,1),LAB[e.st]]; });
      out('dif',['Ir (pu)','Id teórico (pu)','Id medido (pu)','Erro %','Status'],x=>{ const e=evDif(fn,s,x,T); return [x.ir,fx(e.it,3),x.idm||'—',fx(e.err,2),LAB[e.st]]; });
      out('z',['Zona','Loop','Ângulo (°)','Z teórico (Ω)','Z medido (Ω)','Erro %','t ajuste (s)','t medido (s)','Status'],x=>{ const e=evZ(fn,s,x,T); return [x.zn,x.ph,x.ang,fx(e.zt,3),x.zm||'—',fx(e.err,2),fx(e.tt,3),x.tm||'—',e.lab||LAB[e.st]]; });
      out('chk',['Verificação','Resultado'],x=>[x.lab,evChk(x).lab]);
      const svg=D.chart?chartOf(fn,r):''; if(svg){ const png=await svgToPng(svg,1400); if(png){ sub('Gráfico da característica'); await addImg(png,W-2*M,D.chart==='rx'?110:100,''); } } }
    need(26); band(`Resultado do relé: ${res.label}${res.manual?' (parecer do responsável)':''}`);
    if(r.obs){ doc.setFont('helvetica','normal'); doc.setFontSize(8.5); const l=doc.splitTextToSize(r.obs,W-2*M); need(l.length*4+4); doc.text(l,M,y+2); y+=l.length*4+4; } }

  /* assinatura */
  need(40); y+=10; doc.setDrawColor(...MUT); doc.line(M+10,y+14,M+80,y+14); doc.line(W-M-80,y+14,W-M-10,y+14);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text(h.tecnico||'Técnico executante',M+45,y+19,{align:'center'}); doc.text(h.resp||'Responsável técnico',W-M-45,y+19,{align:'center'});
  doc.setTextColor(...MUT); doc.text('Técnico executante',M+45,y+23,{align:'center'}); doc.text(h.art?'ART '+h.art:'Responsável técnico',W-M-45,y+23,{align:'center'});

  /* contracapa */
  doc.addPage(); doc.setFillColor(...C_NAVY); doc.rect(0,0,W,H,'F'); doc.addImage(LOGO_BRANCO,'PNG',(W-70)/2,70,70,26.9);
  doc.setFillColor(...C_GOLD); doc.rect(W/2-12,104,24,1.4,'F'); doc.setTextColor(255); doc.setFontSize(12); doc.text('Dúvidas sobre este relatório ou sobre a próxima manutenção?',W/2,118,{align:'center'});
  let ky=134; for(const [k,v] of [['TELEFONES','(11) 2987-4200 · (11) 99609-4663 · (11) 91234-4920'],['E-MAIL','comercial@xpaengenharia.com.br'],['SITE','www.xpaengenharia.com.br'],['ENDEREÇO','Rua Aragão, 538 · Vila Mazzei · São Paulo/SP']]){
    doc.setTextColor(...C_GOLD); doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text(k,W/2,ky,{align:'center'}); doc.setTextColor(255); doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.text(v,W/2,ky+6,{align:'center'}); ky+=17; }
  doc.setTextColor(184,194,214); doc.setFont('helvetica','italic'); doc.setFontSize(9.5); doc.text('Segurança, confiabilidade e excelência em soluções elétricas.',W/2,ky+6,{align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text('XPA Engenharia, Manutenção e Comércio Ltda.',W/2,ky+12,{align:'center'});

  /* rodapés */
  const n=doc.getNumberOfPages(); for(let p=2;p<n;p++){ doc.setPage(p); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...MUT); doc.setDrawColor(213,218,226); doc.line(M,H-11,W-M,H-11);
    doc.text('XPA Engenharia Elétrica · www.xpaengenharia.com.br',M,H-7); doc.text(`${num_} · página ${p} de ${n}`,W-M,H-7,{align:'right'}); }
  const ok=await saveFile(`Relatorio_MP_Reles_${num_!=='—'?slug(num_)+'_':''}${slug(h.cliente||'cliente')}_${h.data||''}.pdf`,doc.output('blob'));
  if(ok) toast('Relatório gerado.'); }

/* ======================= DIAGNÓSTICO E INÍCIO ======================= */
document.addEventListener('click',e=>{ if(e.target&&e.target.id==='sv'){
  const t=`Ambiente Claude: ${DIAG.runtime}\nBanco de dados: ${DIAG.db}\nUsuário: ${DIAG.user}\nDownload de arquivos: ${DIAG.downloads}\nArmazenamento do aparelho: ${DIAG.local} · banco local: ${DIAG.idb}\nPendentes de envio: ${PENDING}\nModo atual: ${MODE==='db'?'conta':MODE==='local'?'aparelho':'memória'}${DIAG.erro?'\nErro: '+DIAG.erro:''}`;
  $('#mbox').innerHTML=`<p style="margin-top:0;font-weight:bold;color:var(--navy)">Diagnóstico de salvamento</p><pre style="white-space:pre-wrap;font-size:13px;background:var(--bg);padding:10px;border-radius:8px">${esc(t)}</pre><div class="row" style="justify-content:flex-end"><button class="btn" id="mok">Fechar</button></div>`;
  $('#modal').classList.add('show'); $('#mok').onclick=()=>$('#modal').classList.remove('show'); }});
$('#hlogo').src=LOGO_BRANCO;
$('#app').innerHTML='<div class="empty">Carregando manutenções...</div>'; setBar('');
(async()=>{ let user=null,dl=null;
  IDB=await idbOpen(); DIAG.idb=IDB?'ok':'indisponível'; DIAG.local=lsLoad()?'ok':'bloqueado'; DIAG.runtime=window.claude?'sim':'não';
  try{ if(window.claude) [DB,user,dl]=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]); }catch(e){ DIAG.erro=String(e&&e.message||e); }
  try{ UID=user?await user.id():null; }catch(e){ UID=null; }
  DIAG.db=DB?'ok':'indisponível'; DIAG.user=UID?'ok':'indisponível'; DIAG.downloads=dl?'ok':'indisponível';
  const local=await localList();
  if(DB&&UID){ MODE='db'; let remote=null;
    if(online()){ try{ const snap=await withTimeout(col().where('kind','==','mp').get(),10000); remote=snap.docs.map(d=>clone(d.data())); }catch(e){} }
    const ob=new Map(await idb.all('outbox')); const map={};
    (remote||[]).forEach(x=>{ if(!(ob.get(x.id)&&ob.get(x.id).op==='del')) map[x.id]=x; });
    for(const x of local){ const r=map[x.id]; if(!r||(x.updatedAt||0)>(r.updatedAt||0)){ map[x.id]=x; if(remote&&IDB&&!ob.has(x.id)) await idb.put('outbox',x.id,{op:'set',kind:'mp',at:Date.now()+Math.random()}); } }
    for(const r of (remote||[])){ const l=local.find(x=>x.id===r.id); if(!l||(r.updatedAt||0)>(l.updatedAt||0)) await localPut(r.id,r); }
    MPS=Object.values(map); if(!remote) toast(online()?'A conta não respondeu: usando os dados salvos no aparelho.':'Sem internet: usando os dados salvos no aparelho.');
  } else { MODE=(IDB||DIAG.local==='ok')?'local':'mem'; MPS=local; }
  window.addEventListener('online',()=>{ showStatus(); sync(); }); window.addEventListener('offline',showStatus);
  setInterval(()=>{ if(PENDING) sync(); },30000);
  await refreshPending(); render(); sync(); })();
</script>
